seed: 42
data:
  augment: false
  representation: raw
train:
  batch_size: 64
  max_epochs: 50
  optimizer: adam
  lr: 0.001
  weight_decay: 0.0
  patience: 10
  monitor: val_macro_f1
  mode: max
  grad_clip_norm: 1.0
  device: auto
eval:
  latency_batch_sizes:
  - 1
  - 256
  latency_warmup: 20
  latency_iters: 200
  latency_threads: 1
name: transformer
owner: M1
model:
  target: har.models.transformer.TransformerHAR
  params:
    in_channels: 9
    seq_len: 128
    d_model: 64
    nhead: 4
    num_layers: 3
    dim_feedforward: 256
    dropout: 0.1
    n_classes: 6
protocol_override: false
run:
  config_file: configs/transformer.yaml
  smoke: false
  no_test: false
  subset: null
  tag: null
