seed: 42
data:
  augment: false
  representation: raw
train:
  batch_size: 64
  max_epochs: 50
  optimizer: adam
  lr: 0.001
  weight_decay: 0.0
  patience: 10
  monitor: val_macro_f1
  mode: max
  grad_clip_norm: 1.0
  device: auto
eval:
  latency_batch_sizes:
  - 1
  - 256
  latency_warmup: 20
  latency_iters: 200
  latency_threads: 1
name: cnn1d
owner: M2
model:
  target: har.models.cnn1d.CNN1D
  params:
    in_channels: 9
    channels:
    - 64
    - 64
    - 128
    - 128
    - 128
    kernel_sizes:
    - 5
    - 5
    - 5
    - 5
    - 3
    pool_after:
    - 1
    - 3
    dropout: 0.5
    n_classes: 6
protocol_override: false
run:
  config_file: configs/cnn1d.yaml
  smoke: false
  no_test: false
  subset: null
  tag: null
