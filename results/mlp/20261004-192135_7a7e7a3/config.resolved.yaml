seed: 42
data:
  augment: false
  representation: features
train:
  batch_size: 64
  max_epochs: 50
  optimizer: adam
  lr: 0.001
  weight_decay: 0.0
  patience: 10
  monitor: val_macro_f1
  mode: max
  grad_clip_norm: 1.0
  device: auto
eval:
  latency_batch_sizes:
  - 1
  - 256
  latency_warmup: 20
  latency_iters: 200
  latency_threads: 1
name: mlp
owner: M1
model:
  target: har.models.mlp.MLP
  params:
    input_dim: 561
    hidden:
    - 256
    - 128
    dropout: 0.3
    n_classes: 6
protocol_override: false
run:
  config_file: configs/mlp.yaml
  smoke: false
  no_test: false
  subset: null
  tag: null
